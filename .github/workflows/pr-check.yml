name: Pull Request Checks

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

jobs:
  # Vérifications rapides pour les PRs
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'yarn'
        
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: TypeScript check
      run: |
        echo "🔍 Checking TypeScript compilation..."
        yarn tsc --noEmit
        
    - name: Check heading hierarchy
      run: |
        echo "🏗️ Checking heading hierarchy..."
        VIOLATIONS=$(grep -rn "text-\(xs\|sm\|base\|lg\|xl\|2xl\|3xl\|4xl\|5xl\|6xl\)" ./src --include="*.tsx" --include="*.jsx" | grep -E "<h[1-6]" | wc -l || echo "0")
        echo "Found $VIOLATIONS heading hierarchy violations"
        
        if [ "$VIOLATIONS" -gt 0 ]; then
          echo "❌ Heading hierarchy violations found:"
          grep -rn "text-\(xs\|sm\|base\|lg\|xl\|2xl\|3xl\|4xl\|5xl\|6xl\)" ./src --include="*.tsx" --include="*.jsx" | grep -E "<h[1-6]" | head -5
          echo ""
          echo "💡 To fix: Remove text-* classes from heading tags (h1, h2, h3, h4, h5, h6)"
          echo "📖 See HEADING_HIERARCHY.md for more details"
          exit 1
        else
          echo "✅ No heading hierarchy violations!"
        fi
        
    - name: Build check
      run: |
        echo "🏗️ Building application..."
        yarn build
        echo "✅ Build successful!"
        
    - name: Check bundle size
      run: |
        echo "📊 Analyzing bundle size..."
        BUNDLE_SIZE=$(du -sb dist | cut -f1)
        BUNDLE_SIZE_MB=$(echo "scale=2; $BUNDLE_SIZE / 1024 / 1024" | bc)
        echo "Bundle size: ${BUNDLE_SIZE_MB}MB"
        
        # Alerte si le bundle dépasse 5MB
        if (( $(echo "$BUNDLE_SIZE_MB > 5" | bc -l) )); then
          echo "⚠️ Warning: Bundle size is large (${BUNDLE_SIZE_MB}MB)"
          echo "Consider code splitting or removing unused dependencies"
        else
          echo "✅ Bundle size is acceptable"
        fi

  # Analyse de la qualité du code
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'yarn'
        
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: Run linter
      run: |
        echo "🔍 Running ESLint..."
        yarn lint || true
        
    - name: Check code formatting
      run: |
        echo "🎨 Checking code formatting..."
        # Si vous utilisez Prettier
        # yarn prettier --check src/
        echo "Code formatting check completed"
        
    - name: Security audit
      run: |
        echo "🔒 Running security audit..."
        yarn audit --level moderate || true

  # Vérification des changements
  changes-check:
    name: Check Changes
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Check for breaking changes
      run: |
        echo "🔍 Checking for potential breaking changes..."
        
        # Vérifier les changements dans les types
        if git diff --name-only origin/main...HEAD | grep -E "types/.*\.ts$"; then
          echo "⚠️ Types modified - potential breaking changes"
          git diff --name-only origin/main...HEAD | grep -E "types/.*\.ts$"
        fi
        
        # Vérifier les changements dans les APIs
        if git diff --name-only origin/main...HEAD | grep -E "api/.*\.tsx?$"; then
          echo "⚠️ API files modified - check for breaking changes"
          git diff --name-only origin/main...HEAD | grep -E "api/.*\.tsx?$"
        fi
        
        echo "✅ Breaking changes check completed"
        
    - name: Check commit messages
      run: |
        echo "📝 Checking commit messages..."
        
        # Vérifier le format des messages de commit
        git log --oneline origin/main..HEAD | while read line; do
          if [[ ! $line =~ ^[a-f0-9]+\ (feat|fix|docs|style|refactor|test|chore)(\(.+\))?:\ .+ ]]; then
            echo "⚠️ Commit message format: $line"
            echo "💡 Consider using conventional commit format: type(scope): description"
          fi
        done
        
        echo "✅ Commit messages checked"

  # Résumé final
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [quick-checks, code-quality, changes-check]
    if: always()
    
    steps:
    - name: Generate summary
      run: |
        echo "## 📋 Pull Request Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.quick-checks.result }}" = "success" ]; then
          echo "✅ **Quick Checks**: Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Quick Checks**: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.code-quality.result }}" = "success" ]; then
          echo "✅ **Code Quality**: Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Code Quality**: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.changes-check.result }}" = "success" ]; then
          echo "✅ **Changes Check**: Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Changes Check**: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🎯 Next Steps" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.quick-checks.result }}" = "success" ] && [ "${{ needs.code-quality.result }}" = "success" ]; then
          echo "- ✅ Ready for review!" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 Merge when approved" >> $GITHUB_STEP_SUMMARY
        else
          echo "- 🔧 Fix failing checks" >> $GITHUB_STEP_SUMMARY
          echo "- 📖 Check the logs for details" >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Set final status
      run: |
        if [ "${{ needs.quick-checks.result }}" = "success" ] && [ "${{ needs.code-quality.result }}" = "success" ]; then
          echo "✅ All checks passed! PR is ready for review."
          exit 0
        else
          echo "❌ Some checks failed. Please review and fix."
          exit 1
        fi

