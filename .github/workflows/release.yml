name: Release to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  # Job de préparation de la release
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Get version
      id: get-version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi
        
    - name: Validate version format
      run: |
        VERSION="${{ steps.get-version.outputs.version }}"
        if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "❌ Invalid version format: $VERSION"
          echo "Expected format: v1.0.0"
          exit 1
        fi
        echo "✅ Valid version: $VERSION"

  # Build pour la production
  build-production:
    name: Build Production
    runs-on: ubuntu-latest
    needs: prepare-release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'yarn'
        
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: Run quality checks
      run: |
        echo "🔍 Running quality checks..."
        yarn tsc --noEmit
        
    - name: Check heading hierarchy
      run: |
        VIOLATIONS=$(grep -rn "text-\(xs\|sm\|base\|lg\|xl\|2xl\|3xl\|4xl\|5xl\|6xl\)" ./src --include="*.tsx" --include="*.jsx" | grep -E "<h[1-6]" | wc -l || echo "0")
        if [ "$VIOLATIONS" -gt 0 ]; then
          echo "❌ Heading hierarchy violations found. Cannot release."
          exit 1
        fi
        
    - name: Build for production
      run: yarn build
      env:
        NODE_ENV: production
        VITE_APP_VERSION: ${{ needs.prepare-release.outputs.version }}
        
    - name: Run bundle analyzer
      run: |
        echo "📊 Analyzing bundle size..."
        du -sh dist/assets/* | sort -h
        BUNDLE_SIZE=$(du -sb dist | cut -f1)
        echo "Total bundle size: $(echo $BUNDLE_SIZE | numfmt --to=iec)"
        
    - name: Upload production build
      uses: actions/upload-artifact@v4
      with:
        name: production-build-${{ needs.prepare-release.outputs.version }}
        path: dist/
        retention-days: 30
        
    - name: Create build info
      run: |
        cat > dist/build-info.json << EOF
        {
          "version": "${{ needs.prepare-release.outputs.version }}",
          "buildDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "commit": "${{ github.sha }}",
          "branch": "${{ github.ref_name }}",
          "workflow": "${{ github.run_id }}"
        }
        EOF

  # Tests de sécurité
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: prepare-release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'yarn'
        
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: Run security audit
      run: |
        echo "🔒 Running security audit..."
        yarn audit --level moderate || true
        
    - name: Check for secrets
      run: |
        echo "🕵️ Checking for exposed secrets..."
        # Vérifier les variables d'environnement exposées
        if grep -r "VITE_.*_SECRET\|VITE_.*_KEY\|VITE_.*_TOKEN" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx"; then
          echo "❌ Potential secrets found in source code!"
          exit 1
        fi
        echo "✅ No secrets found in source code"

  # Déploiement en production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [prepare-release, build-production, security-scan]
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: production-build-${{ needs.prepare-release.outputs.version }}
        path: dist/
        
    - name: Deploy to production
      run: |
        echo "🚀 Deploying version ${{ needs.prepare-release.outputs.version }} to production..."
        # Ici, ajoutez vos commandes de déploiement réelles
        # Exemples :
        # - aws s3 sync dist/ s3://your-bucket/
        # - rsync -avz dist/ user@server:/var/www/html/
        # - kubectl apply -f k8s/
        echo "✅ Deployment completed successfully!"
        
    - name: Health check
      run: |
        echo "🏥 Running post-deployment health checks..."
        # Ajoutez ici vos vérifications de santé
        # curl -f https://your-app.com/health
        echo "✅ Health checks passed"

  # Création de la release GitHub
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, deploy-production]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Generate changelog
      id: changelog
      run: |
        echo "## 🚀 What's New in ${{ needs.prepare-release.outputs.version }}" > RELEASE_NOTES.md
        echo "" >> RELEASE_NOTES.md
        echo "### ✨ Features" >> RELEASE_NOTES.md
        echo "- Improved heading hierarchy for mobile" >> RELEASE_NOTES.md
        echo "- Enhanced TypeScript support" >> RELEASE_NOTES.md
        echo "" >> RELEASE_NOTES.md
        echo "### 🐛 Bug Fixes" >> RELEASE_NOTES.md
        echo "- Fixed TypeScript compilation errors" >> RELEASE_NOTES.md
        echo "- Corrected heading size inconsistencies" >> RELEASE_NOTES.md
        echo "" >> RELEASE_NOTES.md
        echo "### 📱 Mobile Optimizations" >> RELEASE_NOTES.md
        echo "- Optimized font sizes for mobile devices" >> RELEASE_NOTES.md
        echo "- Improved responsive design" >> RELEASE_NOTES.md
        
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ needs.prepare-release.outputs.version }}
        release_name: Release ${{ needs.prepare-release.outputs.version }}
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: false

  # Notification finale
  notify-completion:
    name: Notify Release Completion
    runs-on: ubuntu-latest
    needs: [prepare-release, create-github-release]
    if: always()
    
    steps:
    - name: Notify success
      if: needs.create-github-release.result == 'success'
      run: |
        echo "🎉 Release ${{ needs.prepare-release.outputs.version }} completed successfully!"
        echo "📦 Build artifacts uploaded"
        echo "🚀 Deployed to production"
        echo "📋 GitHub release created"
        
    - name: Notify failure
      if: needs.create-github-release.result == 'failure'
      run: |
        echo "❌ Release ${{ needs.prepare-release.outputs.version }} failed!"
        echo "Please check the logs and try again."
        exit 1

