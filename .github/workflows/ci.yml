name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Job de test et build
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
        
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: Check TypeScript compilation
      run: yarn tsc --noEmit
      
    - name: Run linter
      run: yarn lint
      continue-on-error: true
      
    - name: Run tests
      run: yarn test
      continue-on-error: true
      
    - name: Build application
      run: yarn build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files-${{ matrix.node-version }}
        path: dist/
        retention-days: 7

  # Job pour vérifier la hiérarchie des titres
  check-heading-hierarchy:
    name: Check Heading Hierarchy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check heading hierarchy violations
      run: |
        echo "🔍 Checking for heading hierarchy violations..."
        VIOLATIONS=$(grep -rn "text-\(xs\|sm\|base\|lg\|xl\|2xl\|3xl\|4xl\|5xl\|6xl\)" ./src --include="*.tsx" --include="*.jsx" | grep -E "<h[1-6]" | wc -l || echo "0")
        echo "Found $VIOLATIONS violations"
        
        if [ "$VIOLATIONS" -gt 0 ]; then
          echo "❌ Heading hierarchy violations found:"
          grep -rn "text-\(xs\|sm\|base\|lg\|xl\|2xl\|3xl\|4xl\|5xl\|6xl\)" ./src --include="*.tsx" --include="*.jsx" | grep -E "<h[1-6]" | head -10
          echo "Please fix these violations by removing text-* classes from heading tags."
          exit 1
        else
          echo "✅ No heading hierarchy violations found!"
        fi

  # Job de déploiement (optionnel)
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'yarn'
        
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: Build for production
      run: yarn build
      env:
        NODE_ENV: production
        
    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        # Ici vous pouvez ajouter vos commandes de déploiement
        # Par exemple: rsync, scp, ou upload vers un service cloud
        echo "✅ Deployment completed"

  # Job de notification
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [build-and-test, check-heading-hierarchy]
    if: always()
    
    steps:
    - name: Notify success
      if: needs.build-and-test.result == 'success' && needs.check-heading-hierarchy.result == 'success'
      run: |
        echo "✅ All checks passed successfully!"
        echo "- Build: ✅"
        echo "- Heading Hierarchy: ✅"
        
    - name: Notify failure
      if: needs.build-and-test.result == 'failure' || needs.check-heading-hierarchy.result == 'failure'
      run: |
        echo "❌ Some checks failed:"
        echo "- Build: ${{ needs.build-and-test.result }}"
        echo "- Heading Hierarchy: ${{ needs.check-heading-hierarchy.result }}"
        exit 1

